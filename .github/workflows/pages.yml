# Deploys static/ to GitHub Pages on every push to main.
#
# Data isn't built here: the updater Lambda (infra/updater.yml) writes it to S3 every 30 minutes and
# pages load it from CloudFront. This job only bakes that URL into static/config.js.
#
# Needs the DATA_URL repository variable (the stack's DataUrl output).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Point the site at the production data
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: |
          if [ -z "$DATA_URL" ]; then
            echo "::error::Set the DATA_URL repository variable to the stack's DataUrl output"
            exit 1
          fi
          sed -i "s#__DATA_URL__#${DATA_URL%/}#" static/config.js
          ! grep -q __DATA_URL__ static/config.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
