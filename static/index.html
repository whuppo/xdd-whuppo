<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>xdd.whuppo</title>
<link rel="stylesheet" href="style.css">
<script>
  // Apply the saved theme before first paint so there's no flash of the wrong colors.
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body class="hub">
<header>
  <div class="brand">
    <div>
      <h1>xdd.whuppo</h1>
      <p class="muted tagline">vibe coded bullshit from United Warriors United</p>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button id="theme" title="Theme: follows your system">◐ Auto</button>
    </div>
  </div>
</header>

<main>
  <h2 class="section-title">Tools</h2>
  <div class="tools">
    <article class="tool-card">
      <img src="https://web.poecdn.com/gen/image/WzI1LDE0LHsiZiI6IjJESXRlbXMvQ3VycmVuY3kvRXNzZW5jZS9TY29ybjciLCJzY2FsZSI6MX1d/ac4ec5f480/Scorn7.png" alt="">
      <div>
        <h3><a href="essences/">Essence Prices</a></h3>
        <p class="muted">Live essence prices laid out like the stash tab, plus a 3:1 upgrade planner for your own stash.</p>
        <div class="chips">
          <a href="essences/#grid">Price grid</a>
          <a href="essences/#list">Price list</a>
          <a href="essences/#upgrade">Upgrade planner</a>
        </div>
      </div>
    </article>
  </div>
</main>

<footer class="muted">
  Prices from <a href="https://poe.ninja" target="_blank" rel="noopener">poe.ninja</a>.
  Not affiliated with Grinding Gear Games.
</footer>

<script src="theme.js"></script>
</body>
</html>
